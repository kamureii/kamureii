name: Update XDR Telemetry SVGs

on:
  schedule:
    - cron: "0 */6 * * *"
  push:
    branches: [main]
    paths:
      - "profile.config.yml"
      - "detections/**"
      - "generator/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generator dependencies
        run: pip install -r generator/requirements.txt

      - name: Validate Sigma bio & generate v3 SVGs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python generator/build_all.py --out-dir /tmp/generated-assets

      - name: Publish SVGs to orphan generated-assets branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin generated-assets >/dev/null 2>&1; then
            git fetch origin generated-assets
            git checkout -B generated-assets origin/generated-assets
          else
            git checkout --orphan generated-assets
            git rm -rf . >/dev/null 2>&1 || true
          fi

          rm -f *.svg
          cp /tmp/generated-assets/*.svg .
          git add *.svg

          if git diff --cached --quiet; then
            echo "No SVG changes detected — skipping commit."
          else
            git commit -m "chore(telemetry): refresh XDR profile SVGs"
            git push origin generated-assets
          fi
