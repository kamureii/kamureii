<svg xmlns="http://www.w3.org/2000/svg" width="880" height="388" viewBox="0 0 880 388" role="img" aria-label="Kamureii Edge Detection Console">
  <title>Kamureii Edge Detection Console — Armed</title>
  <defs>
    <linearGradient id="signalVector" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E52E3D" />
      <stop offset="48%" stop-color="#9E2450" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <linearGradient id="traceStroke" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="55%" stop-color="#9E2450" />
